name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re-)release, e.g. 1.0.0. Required for manual runs.'
        required: true
      force-retag:
        description: 'Delete and recreate the tag if it already exists'
        type: boolean
        default: false

jobs:
  parse-version:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/') && github.base_ref == 'master')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        uses: tcfoss/github-actions/.github/actions/parse-release-version@v1
        with:
          branch: ${{ github.head_ref }}
          version-override: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

  tag:
    needs: parse-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag release
        run: |
          version="v${{ needs.parse-version.outputs.version }}"
          if [[ "${{ inputs.force-retag }}" == "true" ]]; then
            git push origin ":refs/tags/$version" || true
            git tag -d "$version" 2>/dev/null || true
          fi
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

  publish-dotnet:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Filtering.slnx

      - name: Build
        run: dotnet build Filtering.slnx --no-restore --configuration Release

      - name: Pack
        run: |
          dotnet pack src/TcfOss.Filtering.Contracts/TcfOss.Filtering.Contracts.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack src/TcfOss.Filtering.Contracts.Newtonsoft/TcfOss.Filtering.Contracts.Newtonsoft.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack src/TcfOss.Filtering.Linq/TcfOss.Filtering.Linq.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack src/TcfOss.Filtering.EntityFrameworkCore/TcfOss.Filtering.EntityFrameworkCore.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack src/TcfOss.Filtering.AspNetCore/TcfOss.Filtering.AspNetCore.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack src/TcfOss.Filtering.CsvOutput/TcfOss.Filtering.CsvOutput.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack src/TcfOss.Filtering.XlsxOutput/TcfOss.Filtering.XlsxOutput.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack src/TcfOss.Filtering.Programmatic/TcfOss.Filtering.Programmatic.csproj \
            --no-build --configuration Release --output ./nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/tcfoss/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: NuGet login (OIDC -> temp API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: tcflanagan

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

  publish-npm:
    needs: [parse-version, tag]
    runs-on: ubuntu-latest
    permissions:
      # id-token: write  # needed if switching back to npmjs.org Trusted Publishing (OIDC)
      packages: write
      contents: read

    defaults:
      run:
        working-directory: npm/tcfoss-filtering-contracts

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tcfoss'
          # registry-url: 'https://registry.npmjs.org'  # npmjs.org alternative (Trusted Publishing)

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Stamp version
        run: npm version "${{ needs.parse-version.outputs.version }}" --no-git-tag-version

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Trusted Publishing (OIDC) alternative for npmjs.org - no token needed:
      # - name: Publish
      #   run: npm publish --access public

  finalize-release:
    needs: [parse-version, publish-dotnet, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release
        uses: tcfoss/github-actions/.github/actions/issuetracker-resolve@v1
        with:
          api-url: ${{ vars.ISSUETRACKER_API_URL }}
          version: ${{ needs.parse-version.outputs.version }}
          token: ${{ secrets.ISSUETRACKER_API_TOKEN }}
          release-url: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.parse-version.outputs.version }}

      - name: Release notes
        id: notes
        uses: tcfoss/github-actions/.github/actions/issuetracker-notes@v1
        with:
          api-url: ${{ vars.ISSUETRACKER_API_URL }}
          version: ${{ needs.parse-version.outputs.version }}
          token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.parse-version.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes-file }}
