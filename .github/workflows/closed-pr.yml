name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re-)release, e.g. 1.0.0. Required for manual runs.'
        required: true
      force-retag:
        description: 'Delete and recreate the tag if it already exists'
        type: boolean
        default: false
jobs:

  resolve-work-items:
    if: github.event.pull_request.merged == true
    uses: tcfoss/github-actions/.github/workflows/resolve-pr-work-items.yml@v1
    permissions:
      contents: read
    with:
      pull-request-description: ${{ github.event.pull_request.body }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      target-status: Done
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}


  parse-version:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/') && github.base_ref == 'master')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        uses: tcfoss/github-actions/.github/actions/parse-release-version@v1
        with:
          branch: ${{ github.head_ref }}
          version-override: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

  tag:
    needs: parse-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TAGGER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAGGER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag release
        run: |
          version="v${{ needs.parse-version.outputs.version }}"
          if [[ "${{ inputs.force-retag }}" == "true" ]]; then
            git push origin ":refs/tags/$version" || true
            git tag -d "$version" 2>/dev/null || true
          fi
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

  publish-dotnet:
    needs: [tag, parse-version]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Filtering.slnx

      - name: Build
        run: dotnet build Filtering.slnx --no-restore --configuration Release

      - name: Pack
        run: |
          version="v${{ needs.parse-version.outputs.version }}"
          projects=(
            "src/TcfOss.Filtering.Contracts/TcfOss.Filtering.Contracts.csproj"
            "src/TcfOss.Filtering.Contracts.Newtonsoft/TcfOss.Filtering.Contracts.Newtonsoft.csproj"
            "src/TcfOss.Filtering.Linq/TcfOss.Filtering.Linq.csproj"
            "src/TcfOss.Filtering.EntityFrameworkCore/TcfOss.Filtering.EntityFrameworkCore.csproj"
            "src/TcfOss.Filtering.AspNetCore/TcfOss.Filtering.AspNetCore.csproj"
            "src/TcfOss.Filtering.CsvOutput/TcfOss.Filtering.CsvOutput.csproj"
            "src/TcfOss.Filtering.XlsxOutput/TcfOss.Filtering.XlsxOutput.csproj"
            "src/TcfOss.Filtering.Programmatic/TcfOss.Filtering.Programmatic.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
                --no-build \
                --configuration Release \
                -p:PackageVersion="$version" \
                --output ./nupkg
          done

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/tcfoss/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: NuGet login (OIDC -> temp API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: tcflanagan

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

  publish-npm:
    needs: [parse-version, tag]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read

    defaults:
      run:
        working-directory: npm/tcfoss-filtering-contracts

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'  # (Trusted Publishing)
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Stamp version
        run: npm version "${{ needs.parse-version.outputs.version }}" --no-git-tag-version

      - name: Show npm config
        run: npm config list

      - name: Check if version already published
        id: check-version
        # npm view returns an exit code of 1 if the version does not exist, which we catch
        run: |
          if npm view @tcfoss/filtering-contracts@${{ needs.parse-version.outputs.version }} version &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ needs.parse-version.outputs.version }} already exists in the registry. Skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish (npmjs)
        if: steps.check-version.outputs.exists != 'true'
        run: npm publish

      - name: Reconfigure npm for GitHub Packages
        run: |
          cat > .npmrc <<'EOF'
          @tcfoss:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version already published (GitHub Packages)
        id: check-version-gh
        run: |
          if npm view @tcfoss/filtering-contracts@${{ needs.parse-version.outputs.version }} version --registry "https://npm.pkg.github.com" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ needs.parse-version.outputs.version }} already exists in GitHub Packages. Skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (GitHub Packages)
        if: steps.check-version-gh.outputs.exists != 'true'
        run: npm publish --registry "https://npm.pkg.github.com"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [parse-version, publish-dotnet, publish-npm, resolve-work-items]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release
        uses: tcfoss/github-actions/.github/actions/issuetracker-resolve@v1
        with:
          api-url: ${{ vars.ISSUETRACKER_API_URL }}
          version: ${{ needs.parse-version.outputs.version }}
          token: ${{ secrets.ISSUETRACKER_API_TOKEN }}
          status: Released
          work-item-status: Released
          release-url: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.parse-version.outputs.version }}

      - name: Release notes
        id: notes
        uses: tcfoss/github-actions/.github/actions/issuetracker-notes@v1
        with:
          api-url: ${{ vars.ISSUETRACKER_API_URL }}
          version: ${{ needs.parse-version.outputs.version }}
          token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.parse-version.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes-file }}
