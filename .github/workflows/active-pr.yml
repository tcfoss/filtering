name: Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

jobs:

  validate-work-items:
    if: github.event.sender.type != 'Bot'
    uses: tcfoss/github-actions/.github/workflows/validate-pr-work-items.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      pull-request-description: ${{ github.event.pull_request.body }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      target-status: Done
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  lint:
    uses: tcfoss/github-actions/.github/workflows/dotnet-lint.yml@v1
    permissions:
      contents: read
    with:
      solution: Filtering.slnx

  npm:
    name: npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: npm/tcfoss-filtering-contracts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: npm/tcfoss-filtering-contracts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  unit-tests:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LINQ
            project: test/TcfOss.Filtering.Linq.Tests/TcfOss.Filtering.Linq.Tests.csproj
          - name: Programmatic
            project: test/TcfOss.Filtering.Programmatic.Tests/TcfOss.Filtering.Programmatic.Tests.csproj
    uses: tcfoss/github-actions/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
    with:
      solution: Filtering.slnx
      project: ${{ matrix.project }}
      name: ${{ matrix.name }}

  integration-test:
    if: >
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: tcfoss/github-actions/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
    with:
      solution: Filtering.slnx
      project: test/TcfOss.Filtering.Linq.IntegrationTests/TcfOss.Filtering.Linq.IntegrationTests.csproj
      name: integration
      integration: true

  today:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.today.outputs.date }}
    steps:
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: [today, validate-work-items]
    if: startsWith(github.head_ref, 'release/')
    uses: tcfoss/github-actions/.github/workflows/validate-release.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      branch: ${{ github.head_ref }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      status: Released
      work-item-status: Released
      work-items-to-be-resolved: ${{ needs.validate-work-items.outputs.work-item-ids }}
      release-date: ${{ needs.today.outputs.date }}
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  coverage:
    needs: [unit-tests, integration-test]
    if: >
      always() &&
      needs.unit-tests.result == 'success' &&
      (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped')
    uses: tcfoss/github-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: read
      pull-requests: write
