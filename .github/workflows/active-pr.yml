name: Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

jobs:

  validate-work-items:
    if: github.event.sender.type != 'Bot'
    uses: tcfoss/github-actions/.github/workflows/validate-pr-work-items.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      pull-request-description: ${{ github.event.pull_request.body }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      target-status: Done
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Filtering.slnx

      - name: Lint
        run: dotnet format Filtering.slnx --verify-no-changes --severity info --no-restore

  unit-tests:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LINQ
            project: test/TcfOss.Filtering.Linq.Tests/TcfOss.Filtering.Linq.Tests.csproj
          - name: Programmatic
            project: test/TcfOss.Filtering.Programmatic.Tests/TcfOss.Filtering.Programmatic.Tests.csproj
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Filtering.slnx

      - name: Build
        run: dotnet build Filtering.slnx --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test "${{ matrix.project }}" \
            --no-build \
            --configuration Release \
            --results-directory TestResults

      - name: Normalize coverage reports
        run: |
          mkdir -p CoverageResults
          shopt -s globstar nullglob
          files=(TestResults/**/*.cobertura.*.xml)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No coverage reports found in TestResults"
            exit 1
          fi

          index=0
          for file in "${files[@]}"; do
            index=$((index + 1))
            cp "$file" "CoverageResults/coverage-unit-${index}.cobertura.xml"
          done

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: CoverageResults/*.cobertura.xml

  integration-test:
    if: >
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Filtering.slnx

      - name: Build
        run: dotnet build Filtering.slnx --no-restore --configuration Release

      - name: Integration test
        run: |
          dotnet test test/TcfOss.Filtering.Linq.IntegrationTests/TcfOss.Filtering.Linq.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --results-directory TestResults

      - name: Normalize coverage reports
        run: |
          mkdir -p CoverageResults
          shopt -s globstar nullglob
          files=(TestResults/**/*.cobertura.*.xml)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No coverage reports found in TestResults"
            exit 1
          fi

          index=0
          for file in "${files[@]}"; do
            index=$((index + 1))
            cp "$file" "CoverageResults/coverage-integration-${index}.cobertura.xml"
          done

      - name: Upload integration test coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: CoverageResults/*.cobertura.xml

  today:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.today.outputs.date }}
    steps:
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: [today, validate-work-items]
    if: startsWith(github.head_ref, 'release/')
    uses: tcfoss/github-actions/.github/workflows/validate-release.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      branch: ${{ github.head_ref }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      release-date: ${{ needs.today.outputs.date }}
      status: Released
      work-item-status: Released
      work-items-to-be-resolved: ${{ needs.validate-work-items.outputs.work-item-ids }}
      release-date: ${{ needs.today.outputs.date }}
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  coverage:
    needs: [unit-tests, integration-test]
    if: >
      always() &&
      needs.unit-tests.result == 'success' &&
      (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped')
    uses: tcfoss/github-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: read
      pull-requests: write
